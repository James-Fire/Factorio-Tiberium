tiberium-advanced-start=Démarrage avancé en Tiberium
tiberium-on-nauvis=[planet=nauvis] Activer le Tiberium sur Nauvis
tiberium-on-vulcanus=[planet=vulcanus] Activer le Tiberium sur Vulcanus
tiberium-on-gleba=[planet=gleba] Activer le Tiberium sur Gleba
tiberium-on-fulgora=[planet=fulgora] Activer le Tiberium sur Fulgora
tiberium-on-aquilo=[planet=aquilo] Activer le Tiberium sur Aquilo
